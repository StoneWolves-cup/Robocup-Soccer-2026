[geral.uart1]
# Ligacao entre os ESPs do Head e Body (TX de um modulo -> RX do outro).
rx = 18
tx = 17

[body.motores]
# TB6612FNG - GPIO usados pela classe Motores.
m1_pwm = 4
m1_in1 = 6
m1_in2 = 5
m2_pwm = 37
m2_in1 = 8
m2_in2 = 38
m3_pwm = 16
m3_in1 = 7
m3_in2 = 15
m4_pwm = 9
m4_in1 = 3
m4_in2 = 46

[body.ihm.oled]
# OLED I2C (pinos informados ao construtor U8g2).
sda = 21
scl = 47

[body.ihm.botoes]
selecionar = 1
mover = 42
voltar = 2

[body.bateria]
# Entrada ADC do divisor de tensao da bateria.
vbat_adc = 39
# Usado somente se HAS_CURRENT_SENSOR estiver habilitado.
corrente_adc = 35

[body.ldr]
# Multiplexador da matriz de 15 sensores no Body.
mux_sinal = 14
mux_s0 = 10
mux_s1 = 11
mux_s2 = 12
mux_s3 = 13

[head.bno055]
sda = 8
scl = 9

[teste.bno055]
# Valores padrao usados por BNO055::begin() nos testes que nao passam pinos.
sda = 8
scl = 9

[head.tssp]
# Ordem dos sensores ao redor da coroa, indice 0 a 15.
pinos = 21, 47, 48, 38, 39, 40, 41, 42, 16, 15, 7, 6, 5, 4, 1, 2

[teste.ultrassonicos]
trig = 10
echo = 11, 12, 13, 14

[teste.ldr_8_sensores]
# Configuracao alternativa do LDR.h (nao e a matriz de 15 sensores do Body).
mux_sinal = 34
mux_s0 = 25
mux_s1 = 26
mux_s2 = 27
leds = 4, 5, 18, 19, 21, 22, 23, 32

[teste.tssp_2_sensores]
sensor1 = 8
sensor2 = 14

[teste.solenoides]
fim_curso_1 = 15
fim_curso_2 = 2
rele_1 = 4
rele_2 = 5

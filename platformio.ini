; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = robo-controle

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = 
	adafruit/Adafruit Unified Sensor
	olikraus/U8g2
	adafruit/Adafruit BNO055@^1.6.4
monitor_speed = 115200

[env:tssp-test]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = 
	-<*>
	+<TEST_TSSP/TSSP_test.cpp>
	+<Movement/mainBNO/PID.cpp>
lib_deps = adafruit/Adafruit BNO055@^1.6.4

[env:tssp-16-test]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = 
	-<*>
	+<TEST_TSSP/TSSP_16_test.cpp>
lib_deps = adafruit/Adafruit BNO055@^1.6.4

[env:bno-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
build_src_filter =
    -<*>
    +<TEST_BNO/TEST_BNO.cpp>
    +<Movement/mainBNO/BNO055.cpp>
    +<Movement/mainBNO/PID.cpp>

[env:ldr-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit Unified Sensor
build_src_filter =
    -<*>
    +<TEST_LDR/TEST_LDR.cpp>

; ESP32-S3 conectado somente aos 16 sensores TSSP. Transmite as atividades
; brutas por ESP-NOW no canal 1 para o firmware robo-controle.
[env:robo-ir]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<ir_sender/main.cpp>
    +<TSSP/TSSP.cpp>

; ESP32-S3 receptor: calcula a direcao, decide o vetor e controla os motores.
[env:robo-controle]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<robot_controller/main.cpp>
    +<Movement/Omni/Omni.cpp>
    +<Movement/MotorMain/Motores.cpp>

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
lib_deps =
	adafruit/Adafruit BNO055
	adafruit/Adafruit Unified Sensor
	olikraus/U8g2
monitor_speed = 115200

[env:espnow-serial-tx]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter =
	-<*>
	+<ESP_NOW_Serial/ESP_NOW_Serial_TX.cpp>

[env:espnow-serial-rx]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter =
	-<*>
	+<ESP_NOW_Serial/ESP_NOW_Serial_RX.cpp>

[env:tssp-test]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter =
	-<*>
	+<TEST_TSSP/TSSP_test.cpp>
	+<Movement/mainBNO/PID.cpp>

[env:tssp-16-test]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter =
	-<*>
	+<TEST_TSSP/TSSP_16_test.cpp>

